# ==============================================================================
# TMUX CONFIG: FEDORA + KITTY + WAYLAND + NEOVIM EDITION
# Production Dotfiles Edition — Lualine Glassy Theme & Auto-Bootstrap
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. TPM AUTO-BOOTSTRAP (AIRTIGHT DOTFILES PORTABILITY)
# ------------------------------------------------------------------------------
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# ------------------------------------------------------------------------------
# 1. GENERAL SETTINGS, SHELL & PREFIX
# ------------------------------------------------------------------------------
set -g default-shell /bin/zsh            # Enforce Zsh subshells across all windows/popups
set -g default-terminal "tmux-256color"
set -s escape-time 1                     # 1ms delay prevents Kitty escape-sequence corruption
set -g history-limit 100000              # Deep scrollback buffer
set -g display-time 2000                 # Status messages display duration (ms)
set -g focus-events on                   # Pass focus events to Neovim
set -g mouse on                          # Enable mouse scrolling & pane resizing
set -g allow-passthrough on              # Allow Kitty image protocol & OSC 52
set -g status-keys vi
set -g remain-on-exit off

# Prefix key setup (Ctrl+a)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start indexing windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on               # Renumber windows sequentially on close

# Kitty Image Passthrough & Environment Propagation
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Sync Kitty window title with active Tmux session and window
set -g set-titles on
set -g set-titles-string "󰓩 #S  #W"

# ------------------------------------------------------------------------------
# 2. TERMINAL COLOR, UNDERCURLS & EXTENDED KEYS (KITTY COMPATIBILITY)
# ------------------------------------------------------------------------------
set -s extended-keys on                  # Pass Kitty enhanced keyboard protocols
set -as terminal-features ",xterm-kitty:RGB:extkeys"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # LSP Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d;m' # Undercurl colors

# ------------------------------------------------------------------------------
# 3. WAYLAND CLIPBOARD & VI COPY MODE
# ------------------------------------------------------------------------------
setw -g mode-keys vi
set -s copy-command 'wl-copy'            # Native Wayland clipboard integration
set -g set-clipboard on

# Vi-style pane selection and copying
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe 'wl-copy'
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# ------------------------------------------------------------------------------
# 4. KEYBINDINGS: NAVIGATION, SPLITS & UNIFIED TOP-CENTER POPUP ALERTS
# ------------------------------------------------------------------------------
# Reload notification centered on top status line (Prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; \
  display-popup -w 30 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰄬  tmux.conf reloaded!  \033[0m' && sleep 0.6"

# Manual Session Save notification centered on top status line (Prefix + Ctrl+s)
bind C-s run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh' \; \
  display-popup -w 30 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰆓  Workspace Saved!  \033[0m' && sleep 0.6"

# Manual Session Restore notification centered on top status line (Prefix + Ctrl+r)
bind C-r run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh' \; \
  display-popup -w 32 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰦬  Workspace Restored!  \033[0m' && sleep 0.6"

# Synchronize Panes Toggle notification centered on top status line (Prefix + y)
bind y setw synchronize-panes \; \
  display-popup -w 34 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰓦  Synchronize Toggled!  \033[0m' && sleep 0.6"

# Intuitive window splits (opens in current working directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# Smart Vim-Aware Navigation (Seamless Neovim Split Switching)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Pane resizing (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane zoom
bind z resize-pane -Z

# Safer Kills
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# Window reordering
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind S command-prompt -p "swap with window:" "swap-window -t '%%'"

# Quick window jumps (Alt + number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Session helpers
bind s choose-tree -Zs -O name
bind N command-prompt -p "New session name:" \
  "new-session -s '%%' -c '#{pane_current_path}'"

# Robust Fuzzy Project Sessionizer (Prefix + f)
bind f display-popup -E -w 80% -h 70% \
  "zsh -c 'target=\$(zoxide query -l | fzf --reverse) || exit 0; name=\$(basename \"\$target\" | tr \".: \" \"___\"); tmux has-session -t \"\$name\" 2>/dev/null || tmux new-session -d -s \"\$name\" -c \"\$target\"; tmux switch-client -t \"\$name\"'"

# Toggle floating scratchpad popup window (Prefix + g)
bind g display-popup -E -w 85% -h 85% -d "#{pane_current_path}" \
  "env -u TMUX tmux new-session -A -s scratch -c '#{pane_current_path}'"

# Spawn floating Lazygit in current working directory (Prefix + Shift+G)
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# ------------------------------------------------------------------------------
# 5. VISUAL STYLING, POPUPS & DYNAMIC RESOURCE METRICS (LUALINE GLASSY THEME)
# ------------------------------------------------------------------------------
set -g status-position top
set -g status-interval 2
set -g status-justify left

# Automatic window naming based on current directory name
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Global popup style (applies to floating popups)
set -g popup-border-style "fg=#38bdf8"
set -g popup-style "bg=#02151e,fg=#e2e8f0"
set -g popup-border-lines rounded

# Glassy Obsidian status bar background (#02151e)
set -g status-style "bg=#02151e,fg=#e2e8f0"

# Glassy status message prompt styling
set -g message-style "bg=#052630,fg=#2dd4bf,bold"
set -g message-command-style "bg=#052630,fg=#2dd4bf,bold"

set -g status-left-length 100
set -g status-right-length 140

# Left status: Session Pill dynamically changes to Yellow (#fbbf24) when Prefix is pressed + Standardized 1-char spacing
set -g status-left "#[fg=#{?client_prefix,#fbbf24,#38bdf8},bg=#02151e]#[fg=#02151e,bg=#{?client_prefix,#fbbf24,#38bdf8},bold] #S#[fg=#{?client_prefix,#fbbf24,#38bdf8},bg=#02151e] #{?window_zoomed_flag,#[fg=#fbbf24,bg=#02151e]#[fg=#02151e,bg=#fbbf24,bold]󰍉 ZOOM#[fg=#fbbf24,bg=#02151e] ,}"

# Active window tab: Glassy Teal pill with current folder name + 1-char space padding
setw -g window-status-current-format "#[fg=#2dd4bf,bg=#02151e]#[fg=#02151e,bg=#2dd4bf,bold]#I  #{?automatic-rename,#{b:pane_current_path},#W}#{?window_bell_flag, !,}#{?window_activity_flag, *,}#[fg=#2dd4bf,bg=#02151e] "

# Inactive window tabs: Subtle container tint (#052630) with muted text (#586e75) + 1-char space padding
setw -g window-status-format "#[fg=#052630,bg=#02151e]#[fg=#586e75,bg=#052630]#I  #{?automatic-rename,#{b:pane_current_path},#W}#{?window_bell_flag, !,}#{?window_activity_flag, *,}#[fg=#052630,bg=#02151e] "

# Right status: Synchronize alert + Sky Blue Host pill + Teal CPU pill + Purple RAM pill
set -g status-right "#{?synchronize-panes,#[fg=#ff5370,bold]󰓦 SYNC ,}#[fg=#052630,bg=#02151e]#[fg=#38bdf8,bg=#052630,bold]󰍹 #H #[fg=#052630,bg=#02151e] #[fg=#052630,bg=#02151e]#[fg=#2dd4bf,bg=#052630,bold] #(top -bn1 | awk '/Cpu/ {printf \"%%.0f%%%%\", 100-\$8}') #[fg=#052630,bg=#02151e] #[fg=#052630,bg=#02151e]#[fg=#c084fc,bg=#052630,bold]󰍛 #(free -m | awk 'NR==2{printf \"%%.0f%%%%\", \$3*100/\$2}') #[fg=#052630,bg=#02151e]"

# Glassy pane border styling
set -g pane-border-style "fg=#052630"
set -g pane-active-border-style "fg=#38bdf8"

# ------------------------------------------------------------------------------
# 6. PLUGINS (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless C-h/j/k/l navigation with Neovim
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'     # Automatic periodic save
set -g @plugin 'tmux-plugins/tmux-open'          # Quick open URLs/files in copy mode
set -g @plugin 'laktak/extrakto'                 # Fuzzy text completion engine

# Continuum & Resurrect Process Restoration
set -g @continuum-restore 'off'                  # Disabled auto-restore to prevent systemd boot collisions
set -g @continuum-save-interval '15'             # Keep auto-saving active sessions every 15m
set -g @resurrect-capture-pane-contents 'on'    # Preserve scrollback buffer & logs
set -g @resurrect-processes 'docker "docker compose" psql mysql btop ssh "flutter run"'

# Extrakto settings
set -g @extrakto_key 'e'
set -g @extrakto_split_direction 'v'
set -g @extrakto_split_size '12'

# Initialize TPM (Keep at the bottom)
run '~/.config/tmux/plugins/tpm/tpm'

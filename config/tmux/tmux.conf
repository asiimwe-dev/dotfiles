# ==============================================================================
# TMUX CONFIG: FEDORA + KITTY + WAYLAND + NEOVIM EDITION
# Production Dotfiles Edition — Glassy Theme + fzf Productivity Suite
# Separate bars: tmux on TOP (windows centred) · lualine on BOTTOM
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. TPM AUTO-BOOTSTRAP (AIRTIGHT DOTFILES PORTABILITY)
# ------------------------------------------------------------------------------
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# ------------------------------------------------------------------------------
# 1. GENERAL SETTINGS, SHELL & PREFIX
# ------------------------------------------------------------------------------
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -s escape-time 1
set -g history-limit 100000
set -g display-time 2000
set -g focus-events on
set -g mouse on
set -g allow-passthrough on
set -g status-keys vi
set -g remain-on-exit off

# Prefix key (Alt+a) — stays on the home row
unbind C-b
unbind C-a
set -g prefix M-a
bind M-a send-prefix

# Indexing from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Kitty / environment
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment KITTY_LISTEN_ON
set -ga update-environment KITTY_WINDOW_ID
set -g set-titles on
set -g set-titles-string "󰓩 #S  #W"

# ------------------------------------------------------------------------------
# 2. TERMINAL COLOR, UNDERCURLS & EXTENDED KEYS (KITTY)
# ------------------------------------------------------------------------------
set -s extended-keys on
set -as terminal-features ",xterm-kitty:RGB:extkeys"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d;m'

# ------------------------------------------------------------------------------
# 3. WAYLAND CLIPBOARD & VI COPY MODE
# ------------------------------------------------------------------------------
setw -g mode-keys vi
set -s copy-command 'wl-copy'
set -g set-clipboard on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe 'wl-copy'
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# ------------------------------------------------------------------------------
# 4. KEYBINDINGS — NAVIGATION, SPLITS, POPUPS, FZF PRODUCTIVITY
# ------------------------------------------------------------------------------

# --- Reload / Resurrect notifications (top-centred) ---
bind r source-file ~/.config/tmux/tmux.conf \; \
  display-popup -w 30 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰄬  tmux.conf reloaded!  \033[0m' && sleep 0.6"

bind C-s run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh' \; \
  display-popup -w 30 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰆓  Workspace Saved!  \033[0m' && sleep 0.6"

bind C-r run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh' \; \
  display-popup -w 32 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰦬  Workspace Restored!  \033[0m' && sleep 0.6"

bind y setw synchronize-panes \; \
  display-popup -w 34 -h 1 -x C -y 0 -b none -E \
  "printf '\033[?25l\033[48;2;5;38;48m\033[38;2;45;212;191m\033[1m  󰓦  Synchronize Toggled!  \033[0m' && sleep 0.6"

# --- Splits (current path) ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# --- Vim-aware pane navigation ---
# Provided by christoomey/vim-tmux-navigator (C-h/j/k/l + C-\ for the last
# pane, in both the root and copy-mode-vi tables, sourced by TPM below).
# The hand-rolled copies that used to live here were shadowed by the plugin.


# --- Resize / zoom / safer kills ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# --- Window reordering ---
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind S command-prompt -p "swap with window:" "swap-window -t '%%'"

# --- Quick window jumps (Alt + number) ---
# Uses := so it targets by index reliably; -n = no prefix needed
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# --- Classic session helpers ---
bind s choose-tree -Zs -O name
bind N command-prompt -p "New session name:" \
  "new-session -s '%%' -c '#{pane_current_path}'"

# ==============================================================================
# FZF PRODUCTIVITY SUITE
# ==============================================================================

# --- Project sessionizer (zoxide + fzf) — Prefix + f ---
bind f display-popup -E -w 80% -h 70% \
  "zsh -c 'target=\$(zoxide query -l | fzf --reverse --prompt=\"󰉋  Project > \") || exit 0; name=\$(basename \"\$target\" | tr \".: \" \"___\"); tmux has-session -t \"\$name\" 2>/dev/null || tmux new-session -d -s \"\$name\" -c \"\$target\"; tmux switch-client -t \"\$name\"'"

# --- Floating scratchpad — Prefix + g ---
bind g display-popup -E -w 85% -h 85% -d "#{pane_current_path}" \
  "env -u TMUX tmux new-session -A -s scratch -c '#{pane_current_path}'"

# --- Lazygit popup — Prefix + G ---
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# --- btop popup — Prefix + B ---
bind B display-popup -E -w 90% -h 90% "btop"

# --- Fuzzy window switcher — Prefix + w ---
bind w display-popup -E -w 70% -h 50% \
  "tmux list-windows -F '#I  #W  #{pane_current_path}' | fzf --reverse --prompt='󰓩  Window > ' | cut -d' ' -f1 | xargs -r tmux select-window -t"

# --- Fuzzy session switcher — Prefix + t ---
bind t display-popup -E -w 70% -h 50% \
  "tmux list-sessions -F '#S' | fzf --reverse --prompt='󰓩  Session > ' | xargs -r tmux switch-client -t"

# --- Fuzzy kill session — Prefix + K ---
bind K display-popup -E -w 60% -h 40% \
  "tmux list-sessions -F '#S' | fzf --reverse --prompt='󰀦  Kill Session > ' | xargs -r -I{} tmux kill-session -t {}"

# --- Fuzzy kill window — Prefix + W ---
bind W display-popup -E -w 60% -h 40% \
  "tmux list-windows -F '#I  #W' | fzf --reverse --prompt='󰀦  Kill Window > ' | cut -d' ' -f1 | xargs -r tmux kill-window -t"

# --- Command Palette (Prefix + Space) ---
# Surfaces the most useful actions in one fzf menu
# Fixed: removed broken --bind that prevented selection from reaching the pipe
bind Space display-popup -E -w 60% -h 55% \
  "printf '%s\n' \
    '󰉋  Project sessionizer          → f' \
    '󰓩  Switch session               → t' \
    '󰓩  Switch window                → w' \
    '󰆍  New session                  → N' \
    '󰒓  Scratchpad                   → g' \
    '󰊢  Lazygit                      → G' \
    '󰍛  btop                         → B' \
    '󰀦  Kill session                 → K' \
    '󰀦  Kill window                  → W' \
    '󰓦  Toggle synchronize-panes     → y' \
    '󰆓  Save workspace (resurrect)   → C-s' \
    '󰦬  Restore workspace            → C-r' \
    '󰑓  Reload tmux.conf             → r' \
    '󰌱  Extrakto (fuzzy copy)        → e' \
    '󰝰  tmux-fzf menu                → C-f' \
  | fzf --reverse --prompt='󰘳  Command Palette > ' \
  | awk '{print \$NF}' \
  | xargs -r -I{} tmux send-keys M-a {}"

# ==============================================================================
# 5. VISUAL STYLING — TOP BAR, CENTRED WINDOWS, GLASSY THEME
# ==============================================================================
set -g status-position top
set -g status-interval 3
set -g status-justify absolute-centre

set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

set -g popup-border-style "fg=#38bdf8"
set -g popup-style "bg=#02151e,fg=#e2e8f0"
set -g popup-border-lines rounded

set -g status-style "bg=#02151e,fg=#e2e8f0"
set -g message-style "bg=#052630,fg=#2dd4bf,bold"
set -g message-command-style "bg=#052630,fg=#2dd4bf,bold"

# Clear residual styles that were causing the underline/strike under the active window pill
setw -g window-status-style "none"
setw -g window-status-current-style "none"
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "none"
set  -g window-status-separator ""

set -g status-left-length 100
set -g status-right-length 130

# Left: Session pill (Red on Sync, Yellow on Prefix, Blue default) + optional ZOOM pill
set -g status-left "#[fg=#{?synchronize-panes,#ff0000,#{?client_prefix,#fbbf24,#38bdf8}},bg=#02151e]#[fg=#02151e,bg=#{?synchronize-panes,#ff0000,#{?client_prefix,#fbbf24,#38bdf8}},bold] #S#[fg=#{?synchronize-panes,#ff0000,#{?client_prefix,#fbbf24,#38bdf8}},bg=#02151e] #{?window_zoomed_flag,#[fg=#fbbf24,bg=#02151e]#[fg=#02151e,bg=#fbbf24,bold]󰍉 ZOOM#[fg=#fbbf24,bg=#02151e] ,}"

# Active window (teal, name truncated)
setw -g window-status-current-format "#[fg=#2dd4bf,bg=#02151e]#[fg=#02151e,bg=#2dd4bf,bold]#I  #{=/16/…:#{?automatic-rename,#{b:pane_current_path},#W}}#{?window_bell_flag, !,}#{?window_activity_flag, *,}#[fg=#2dd4bf,bg=#02151e]"

# Inactive window
setw -g window-status-format "#[fg=#052630,bg=#02151e]#[fg=#586e75,bg=#052630]#I  #{=/16/…:#{?automatic-rename,#{b:pane_current_path},#W}}#{?window_bell_flag, !,}#{?window_activity_flag, *,}#[fg=#052630,bg=#02151e]"

# Right: Network/VPN pill + CPU/RAM pill (Red on Sync, Yellow on Prefix, Blue default)
set -g status-right "#[fg=#052630,bg=#02151e]#[fg=#38bdf8,bg=#052630,bold]#($HOME/.config/tmux/scripts/status-net.sh)#[fg=#052630,bg=#02151e] #[fg=#{?synchronize-panes,#ff0000,#{?client_prefix,#fbbf24,#38bdf8}},bg=#02151e]#[fg=#02151e,bg=#{?synchronize-panes,#ff0000,#{?client_prefix,#fbbf24,#38bdf8}},bold]#($HOME/.config/tmux/scripts/status-sys.sh)#[fg=#{?synchronize-panes,#ff0000,#{?client_prefix,#fbbf24,#38bdf8}},bg=#02151e]"

set -g pane-border-style "fg=#052630"
set -g pane-active-border-style "fg=#38bdf8"

# ------------------------------------------------------------------------------
# 6. PLUGINS (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'                 # Full fzf menu system

# Continuum / Resurrect
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'podman "podman compose" podman-compose psql mysql btop ssh "flutter run"'

# Extrakto
set -g @extrakto_key 'e'
set -g @extrakto_split_direction 'v'
set -g @extrakto_split_size '12'

# tmux-fzf — launch with Prefix + Ctrl-f (avoids clash with project sessionizer)
set-environment -g TMUX_FZF_LAUNCH_KEY "C-f"
# Optional nicer preview / layout defaults
set -g @tmux-fzf-order 'session|window|pane|command|keybinding'

# Initialize TPM (must stay at the bottom)
run '~/.config/tmux/plugins/tpm/tpm'

# ==============================================================================
# KITTY CONFIG: MASTER VISUAL EDITION
# Fedora + KDE Plasma 6 (Wayland) + Zsh + Neovim Setup
# ==============================================================================


# ==============================================================================
# 1. 󰛖 FONT & DIAGNOSTICS
# ==============================================================================

font_family          JetBrainsMono Nerd Font
bold_font            auto
italic_font          auto
bold_italic_font     auto

font_size            14.0

# Programming ligatures
disable_ligatures    cursor

# Font rendering & cell tweaks
modify_font cell_height 110%
modify_font cell_width 100%
modify_font baseline 0          # Adjust positive/negative if text looks vertically off-center
modify_font underline_thickness 100%
modify_font underline_position -1

# Neovim LSP thick undercurls
undercurl_style thick-sparse
underline_exclusion 1


# ==============================================================================
# 2. 󰏘 FROSTED GLASS & FRAMELESS BORDERS (KDE WAYLAND)
# ==============================================================================

background_opacity            0.87
dynamic_background_opacity    yes
background_blur               0

inactive_text_alpha           0.65

window_padding_width          6
window_margin_width           4
single_window_margin_width    0

# Borderless frameless window for clean KDE Plasma integration
hide_window_decorations       no
draw_minimal_borders          yes
window_border_width           1.5px

# Glowing active pane border vs dimmed inactive pane
active_border_color           #7aa2f7
inactive_border_color         #1f2335
bell_border_color             #ff9e64

remember_window_size          no
initial_window_width          140c
initial_window_height         35c

confirm_os_window_close       0
dynamic_title                 yes

resize_debounce_time          0.05
placement_strategy           center

# ==============================================================================
# NATIVE KITTY ANIMATED CURSOR TRAIL (FOR TERMINAL & NEOVIM)
# ==============================================================================

cursor_shape                  beam
cursor_beam_thickness        2.0

# Breathing cursor animation when idle
cursor_blink_interval        0.5 ease-in-out
cursor_stop_blinking_after   0

# Particle trail — threshold set to 1 so every hjkl movement in Neovim animates
cursor_trail                  1
cursor_trail_decay            0.1 0.4
cursor_trail_start_threshold  1
cursor_trail_color            #7aa2f7

# Mouse vanishes on keypress so it never covers text
mouse_hide_wait               -1.0

# ==============================================================================
# 4. 󰓩 TOP ROUND FLOATING TAB DOCK (NERD FONT ICONS)
# ==============================================================================

tab_bar_edge                  top
tab_bar_align                 center
tab_bar_style                 powerline
tab_powerline_style          round
tab_bar_min_tabs              2

# Floating margin effect
tab_bar_margin_width          8.0
tab_bar_margin_height         6.0 2.0

active_tab_font_style         bold
inactive_tab_font_style       normal

# High-contrast bright color scheme (Electric Neon Palette)
active_tab_foreground         #000000
active_tab_background         #00FFC6
inactive_tab_foreground       #A0A5C0
inactive_tab_background       #181A24

# Embedded Nerd Font icons (no emojis)
tab_title_template            " 󰈔 {index}  {title} "
active_tab_title_template     " 󰓩 {index}  {title} 󱐋 "
tab_activity_symbol           " 󰂞 "
bell_on_tab                   " 󰂞 "

# ==============================================================================
# 5. 󰋽 SLEEK INTERACTIVE ACCENT SCROLLBAR
# ==============================================================================

scrollbar                     scrolled
scrollbar_interactive         yes
scrollbar_width               0.6
scrollbar_hover_width         1.2
scrollbar_radius              0.5
scrollbar_handle_opacity      0.7
scrollbar_track_opacity       0.1
scrollbar_handle_color        #7aa2f7
scrollbar_track_color         #1f2335


# ==============================================================================
# 6. 󰓅 PERFORMANCE, ZSH & NEOVIM SCROLLBACK
# ==============================================================================

text_composition_strategy    platform

repaint_delay                 3
input_delay                   0
sync_to_monitor               yes

# Deep Zsh integration (prompt jumping with Ctrl+Shift+Z, title sync)
shell_integration             enabled

scrollback_lines              50000
scrollback_fill_enlarged_window yes

# Neovim scrollback pager (preserves ANSI colors, press 'q' to exit)
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

resize_draw_strategy          scale


# ==============================================================================
# 7. 󰍽 MOUSE & LINK STYLING
# ==============================================================================

focus_follows_mouse           no

copy_on_select                yes
clipboard_control             write-clipboard write-primary
clipboard_max_size            256

strip_trailing_spaces         smart
select_by_word_characters     @-./_~:=?&%#

detect_urls                   yes
open_url_with                 default

# Glowing cyan wavy link underlines on hover
url_color                     #7dcfff
url_style                     dashed
underline_hyperlinks          hover
allow_hyperlinks              yes


# ==============================================================================
# 8. 󰂞 VISUAL BELL & NOTIFICATIONS
# ==============================================================================

enable_audio_bell             no
visual_bell_duration          0.15
visual_bell_color             #3b4261
window_alert_on_bell          no

notify_on_cmd_finish          unfocused 8


# ==============================================================================
# 9. 󰒋 REMOTE CONTROL, LAYOUTS & WAYLAND
# ==============================================================================

allow_remote_control          socket-only
listen_on                     unix:@kitty

enabled_layouts               splits,tall,grid,stack

linux_display_server          auto
wayland_enable_ime            yes
wayland_titlebar_color        system


# ==============================================================================
# 10. 󰏘 THEME
# ==============================================================================

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME


# ==============================================================================
# 11. 󰌌 KEYBINDS
# ==============================================================================

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font sizing
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+backspace change_font_size all 0

# Opacity adjustments on the fly
map ctrl+shift+equal set_background_opacity +0.05
map ctrl+shift+minus set_background_opacity -0.05
map ctrl+shift+0 set_background_opacity default

# Windows & Splits
map alt+s launch --location=hsplit --cwd=current
map alt+v launch --location=vsplit --cwd=current
map alt+enter launch --cwd=current
map alt+q close_window

# Toggle Zoom / Maximize active split pane
map alt+z toggle_layout stack

# Vim Navigation
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

# Resize Panes
map alt+shift+h resize_window narrower 5
map alt+shift+l resize_window wider 5
map alt+shift+k resize_window taller 5
map alt+shift+j resize_window shorter 5

# Layout Switching
map alt+n next_layout

# Tabs Navigation
map ctrl+t new_tab_with_cwd
map ctrl+shift+t new_tab
# map ctrl+w close_tab (commented this out to favour deleting word but word in the terminal window)
map ctrl+shift+w close_window

map alt+, previous_tab
map alt+. next_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

map ctrl+shift+n new_os_window

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Developer Launchers
map ctrl+shift+g launch --cwd=current lazygit
map ctrl+shift+b launch --cwd=current btop
map ctrl+shift+h launch --cwd=current htop
map ctrl+shift+e launch --cwd=current nvim

# Kitten Hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>u kitten hints --type url
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>h kitten hints --type hash --program -

# Broadcast & Scrollback
map ctrl+shift+x toggle_broadcast
map ctrl+shift+f show_scrollback

# Reload Config Live
map ctrl+shift+r reload_config

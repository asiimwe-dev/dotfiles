# ==============================================================================
# KITTY CONFIG: MASTER VISUAL EDITION
# Fedora + KDE Plasma 6 (Wayland) + Zsh + Neovim Setup
# ==============================================================================

# The theme is included FIRST on purpose: kitty applies options in order, so
# everything below overrides it. When this block sat near the bottom it was
# silently replacing the tab, border and URL colours set further up.
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME


# ==============================================================================
# 1. 󰛖 FONT & DIAGNOSTICS
# ==============================================================================

font_family          PlemolJP Console NF

font_size            14.5

# Programming ligatures (PlemolJP has none; "cursor" is the coding default if
# you ever switch to a ligature font such as JetBrainsMono NF)
disable_ligatures    cursor

# Font rendering & cell tweaks
modify_font cell_height 105%
# modify_font cell_width 100%
# modify_font baseline 0          # Adjust positive/negative if text looks vertically off-center
modify_font underline_thickness 100%
modify_font underline_position -1

# Neovim LSP undercurls: thin reads clearly without shouting (kitty default).
# thick-sparse is the boldest variant and made every diagnostic line loud.
undercurl_style thin-sparse
underline_exclusion 1


# ==============================================================================
# 2. 󰏘 FROSTED GLASS & FRAMELESS BORDERS (KDE WAYLAND)
# ==============================================================================

background_opacity            0.88
dynamic_background_opacity    yes
# KDE Wayland: needs KWin's Blur effect enabled
background_blur               1

inactive_text_alpha           0.65

window_padding_width          6
window_margin_width           4
single_window_margin_width    0

# Borderless frameless window for clean KDE Plasma integration
hide_window_decorations       yes
draw_minimal_borders          yes
window_border_width           1.5px

# Glowing active pane border vs dimmed inactive pane (Neovim palette accents)
active_border_color           #38bdf8
inactive_border_color         #052630
bell_border_color             #f97316

remember_window_size          no
initial_window_width          140c
initial_window_height         35c

# -1 = only confirm when a command is actually running (shell integration),
# never at a bare prompt. Protects unsaved Neovim buffers from a stray close.
confirm_os_window_close       -1

resize_debounce_time          0.05
placement_strategy           center

# ==============================================================================
# NATIVE KITTY ANIMATED CURSOR TRAIL (FOR TERMINAL & NEOVIM)
# ==============================================================================

cursor_shape                  beam
cursor_beam_thickness        2.0

# Breathing cursor animation when idle (stops after 15s of no typing)
cursor_blink_interval        0.5 ease-in-out
cursor_stop_blinking_after   15

# Particle trail — threshold set to 1 so every hjkl movement in Neovim animates
cursor_trail                  1
cursor_trail_decay            0.1 0.4
cursor_trail_start_threshold  1
cursor_trail_color            #38bdf8

# Mouse vanishes on keypress so it never covers text
mouse_hide_wait               -1.0

# ==============================================================================
# 4. 󰓩 TOP ROUND FLOATING TAB DOCK (NERD FONT ICONS)
# ==============================================================================

tab_bar_edge                  top
tab_bar_align                 center
tab_bar_style                 powerline
tab_powerline_style          round
tab_bar_min_tabs              2

# Floating margin effect
tab_bar_margin_width          8.0
tab_bar_margin_height         6.0 2.0

active_tab_font_style         bold
inactive_tab_font_style       normal

# Bright glass tab palette (Neovim accents; no neon green)
active_tab_foreground         #02151e
active_tab_background         #38bdf8
inactive_tab_foreground       #94a3b8
inactive_tab_background       #052630

# Embedded Nerd Font icons (no emojis)
tab_title_template            " 󰈔 {index}  {title} "
active_tab_title_template     " 󰓩 {index}  {title} 󱐋 "
tab_activity_symbol           " 󰂞 "
bell_on_tab                   " 󰂞 "

# ==============================================================================
# 5. 󰋽 SLEEK INTERACTIVE ACCENT SCROLLBAR
# ==============================================================================

scrollbar                     scrolled
scrollbar_interactive         yes
scrollbar_width               0.6
scrollbar_hover_width         1.2
scrollbar_radius              0.5
scrollbar_handle_opacity      0.7
scrollbar_track_opacity       0.1
scrollbar_handle_color        #38bdf8
scrollbar_track_color         #052630


# ==============================================================================
# 6. 󰓅 PERFORMANCE, ZSH & NEOVIM SCROLLBACK
# ==============================================================================

text_composition_strategy    platform

# 10 ms is kitty's default and already yields ~100 FPS; 3 ms only added
# wakeups (sync_to_monitor caps the real refresh rate anyway).
repaint_delay                 10
input_delay                   0
sync_to_monitor               yes

# Deep Zsh integration (prompt jumping with Ctrl+Shift+Z, title sync)
shell_integration             enabled

scrollback_lines              50000
scrollback_fill_enlarged_window yes

# Neovim scrollback pager (documented upstream setup for Neovim 0.12+,
# preserves ANSI colors, press 'q' to exit)
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
# Extra history (MB) available only to the pager, beyond scrollback_lines
scrollback_pager_history_size  32


# ==============================================================================
# 7. 󰍽 MOUSE & LINK STYLING
# ==============================================================================

focus_follows_mouse           no

copy_on_select                yes
# read-*-ask keeps OSC52 paste working from remote sessions, with a prompt
clipboard_control             write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size            256

strip_trailing_spaces         smart
select_by_word_characters     @-./_~:=?&%#

detect_urls                   yes
open_url_with                 default

# Links stay quiet until you actually use them (Ctrl+Shift+click / Ctrl+Shift+E)
url_color                     #2dd4bf
url_style                     dashed
underline_hyperlinks          never
allow_hyperlinks              yes


# ==============================================================================
# 8. 󰂞 VISUAL BELL & NOTIFICATIONS
# ==============================================================================

enable_audio_bell             no
visual_bell_duration          0.15
visual_bell_color             #052630
window_alert_on_bell          no

notify_on_cmd_finish          unfocused 8


# ==============================================================================
# 9. 󰒋 REMOTE CONTROL, LAYOUTS & WAYLAND
# ==============================================================================

allow_remote_control          socket-only
listen_on                     unix:@kitty

enabled_layouts               splits,tall,grid,stack

linux_display_server          auto
wayland_enable_ime            yes
wayland_titlebar_color        system


# ==============================================================================
# 10. 󰏘 THEME OVERRIDES
# ==============================================================================

# (include lives at the top of this file so these values win.)
# Match Neovim's transparent bg_base so the solid lualine bar is seamless.
background                      #02151e
cursor_text_color               #02151e


# ==============================================================================
# 11. 󰌌 KEYBINDS
# ==============================================================================

# Clipboard: kitty's defaults (ctrl+shift+c / ctrl+shift+v) already do this.

# Font sizing: kitty's defaults are ctrl+shift+equal / ctrl+shift+minus (±2)
# and ctrl+shift+backspace resets. Keeping them also keeps <C-t> and <C-BS>
# available to Neovim.

# Opacity adjustments (moved off the font-size keys)
map ctrl+alt+equal set_background_opacity +0.05
map ctrl+alt+minus set_background_opacity -0.05
map ctrl+alt+0 set_background_opacity default

# Windows & Splits
map alt+s launch --location=hsplit --cwd=current
map alt+v launch --location=vsplit --cwd=current
map alt+enter launch --cwd=current
# ignore-shell: only prompt when a command is running (e.g. Neovim)
map alt+q close_window_with_confirmation ignore-shell

# Toggle Zoom / Maximize active split pane
map alt+z toggle_layout stack

# Vim Navigation
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

# Resize Panes
map alt+shift+h resize_window narrower 5
map alt+shift+l resize_window wider 5
map alt+shift+k resize_window taller 5
map alt+shift+j resize_window shorter 5

# Layout Switching
map alt+n next_layout

# Tabs Navigation
# Ctrl+T is deliberately left free for Neovim (tag jump, picker "open in tab")
map ctrl+shift+t new_tab_with_cwd
# map ctrl+w close_tab (commented this out to favour deleting word but word in the terminal window)
map ctrl+shift+w close_window_with_confirmation ignore-shell

map alt+, previous_tab
map alt+. next_tab
# ctrl+tab / ctrl+shift+tab / ctrl+shift+n are kitty defaults.

# map alt+1 goto_tab 1
# map alt+2 goto_tab 2
# map alt+3 goto_tab 3
# map alt+4 goto_tab 4
# map alt+5 goto_tab 5
# map alt+6 goto_tab 6
# map alt+7 goto_tab 7
# map alt+8 goto_tab 8
# map alt+9 goto_tab 9

# Developer Launchers (moved off ctrl+shift+{g,b,h,e} so kitty's
# show_last_command_output / show_scrollback / open_url_with_hints and
# move_window_backward keep their defaults)
map ctrl+shift+alt+g launch --cwd=current lazygit
map ctrl+shift+alt+b launch --cwd=current btop
map ctrl+shift+alt+h launch --cwd=current htop
map ctrl+shift+alt+e launch --cwd=current nvim

# Kitten Hints: kitty's defaults cover path/line/word/hash, keep only the
# extra URL picker
map ctrl+shift+p>u kitten hints --type url

# Broadcast (Ctrl+Shift+X is kitty's "scroll to next prompt")
map ctrl+shift+alt+x toggle_broadcast

# Reload Config Live
map ctrl+shift+r reload_config

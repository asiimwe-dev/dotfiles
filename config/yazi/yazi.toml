# ==============================================================================
# YAZI CONFIGURATION
# Keyboard-first developer workflow
# Fedora • Kitty • Neovim
# ==============================================================================

# ==============================================================================
# Manager (renamed from [manager] to [mgr] in current Yazi)
# ==============================================================================

[mgr]

show_hidden = false
show_symlink = true
sort_dir_first = true

# Sorting
sort_by = "natural"
sort_sensitive = false
sort_reverse = false

# Display file sizes
linemode = "size"

# Scroll offset (like Vim scrolloff)
scrolloff = 5

# Mouse support (added "drag" for drag-to-select)
mouse_events = ["click", "scroll", "drag"]

# ==============================================================================
# Preview
# ==============================================================================

[preview]

# Large previews
max_width = 1200
max_height = 1200

# Cache previews
cache_dir = "~/.cache/yazi"

# ==============================================================================
# Opener
# ==============================================================================

[opener]

edit = [
    { run = 'nvim %s', block = true, desc = "Edit" }
]

open = [
    { run = 'for f in %s; do xdg-open "$f" & done', orphan = true, desc = "Open" }
]

play_video = [
    { run = 'vlc %s', orphan = true, desc = "VLC" }
]

play_audio = [
    { run = 'elisa %s', orphan = true, desc = "Elisa" }
]

# ==============================================================================
# Open Rules
# ==============================================================================

[open]

prepend_rules = [
    { mime = "video/*", use = [ "play_video", "open" ] },
    { mime = "audio/*", use = [ "play_audio", "open" ] },
]

# ==============================================================================
# Tasks
# Field names changed in current Yazi: micro_workers/macro_workers no longer
# exist. These are the current equivalents, sized generously for a dev box.
# ==============================================================================

[tasks]

file_workers = 10
plugin_workers = 25
fetch_workers = 10
preload_workers = 10
process_workers = 25
bizarre_retry = 3
suppress_preload = false

# ==============================================================================
# Plugin Settings
# ==============================================================================

[plugin]

prepend_previewers = [
    # glow.yazi is deprecated upstream (its own README says so) in favor of
    # piper.yazi, the official general-purpose "pipe a shell command as
    # preview" plugin. This renders markdown through glow via piper.
    # Requires: `ya pkg add yazi-rs/plugins:piper` (and `glow` on PATH).
    { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -s=dark -w=$w "$1"' },

    # Archive previews via ouch — consolidated into one mime rule instead of
    # five separate ones (this is the pattern ouch's own README recommends).
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "ouch" },
]

prepend_fetchers = [
  { id = "git", url = "*", run = "git", group = "git" },
  { id = "git", url = "*/", run = "git", group = "git" },
]
append_previewers = []
prepend_preloaders = []
append_preloaders = []

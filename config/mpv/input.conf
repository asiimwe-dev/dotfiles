# ~/.config/mpv/input.conf
# Keybindings layered on top of mpv's defaults (this does NOT replace them).
# Vim-ish muscle memory where it makes sense, plus a few quality-of-life additions.

# --- Seeking ---
h seek -5
l seek 5
j seek -60
k seek 60
H seek -5 exact
L seek 5 exact
RIGHT seek 5
LEFT seek -5
UP seek 60
DOWN seek -60

# --- Frame stepping ---
. frame-step
, frame-back-step

# --- Playback speed ---
[ add speed -0.1
] add speed 0.1
BS set speed 1.0
{ multiply speed 0.5
} multiply speed 2.0

# --- Volume ---
9 add volume -2
0 add volume 2
m cycle mute

# --- Subtitles ---
v cycle sub-visibility
Ctrl+j cycle sub           # next subtitle track (j alone is seek -60s, see Seeking above)
Ctrl+k cycle sub down      # previous subtitle track
z add sub-delay -0.1
x add sub-delay 0.1
Z add sub-pos -1
X add sub-pos 1

# --- Audio tracks ---
# (left mostly on mpv defaults: # cycles audio tracks)

# --- Playlist ---
> playlist-next
< playlist-prev
# Note: playlist-play-index requires a numeric argument (e.g. via a Lua/JS
# script building a playlist menu) and cannot be bound directly to a key
# with no argument — removed the broken ENTER binding that was here.

# --- Chapters ---
PGUP add chapter 1
PGDWN add chapter -1

# --- Screenshots ---
s screenshot video
S screenshot window
Ctrl+s screenshot each-frame

# --- Window / fullscreen ---
f cycle fullscreen
T cycle ontop
w cycle-values window-scale "0.5" "1.0" "1.5" "2.0"

# --- Loop ---
# Note: r/R override mpv's stock default (sub-scale adjust) with AB-loop
# instead, since AB-loop is used far more often in this workflow.
r ab-loop
R no-osd set ab-loop-a no ; no-osd set ab-loop-b no ; show-text "AB loop cleared"
Ctrl+l cycle-values loop-file "inf" "no"   # L alone is seek +5s exact, see Seeking above

# --- Quit ---
q quit-watch-later           # quit and remember position
Q quit                       # quit without saving position

# --- Interpolation toggle (off by default in mpv.conf for perf) ---
Ctrl+i cycle interpolation

# --- Stats / debug ---
I script-binding stats/display-stats-toggle
` script-binding console/enable

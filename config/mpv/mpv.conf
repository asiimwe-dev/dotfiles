# ~/.config/mpv/mpv.conf
# Production mpv config for a terminal-centric workflow.
# Covers local playback, streaming via yt-dlp, screenshots, and sane defaults.

###############################################################################
# VIDEO OUTPUT / PERFORMANCE
###############################################################################

vo=gpu                          # classic GPU renderer; broader/more reliable hwdec fallback
                                 # than gpu-next on systems without working Vulkan video decode
                                 # (gpu-next tries VK_KHR_video_decode_queue / CUDA and can fail
                                 # loudly instead of falling back — switch back to gpu-next with
                                 # `mpv --vo=gpu-next file` if your GPU/driver supports it well)
gpu-context=auto

# HP EliteBook 840 G8 (Iris Xe): VAAPI hardware decode is available (see
# `vainfo`), but hwdec=auto-safe makes ffmpeg probe the Vulkan and CUDA decode
# paths first, which prints warnings on this system (VK_KHR_video_decode_queue,
# libcuda.so.1). Software decode is used instead, which is clean and plays
# 1080p smoothly on this CPU. To try hardware decode later, test
# `mpv --hwdec=vaapi <file>` before changing this line.
hwdec=no
profile=gpu-hq                 # high-quality scaling/dithering preset
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dither-depth=auto
correct-downscaling=yes
interpolation=no               # keep off by default; costs battery/CPU, enable per-file with --interpolation

###############################################################################
# AUDIO
###############################################################################

volume=70                      # sane default; avoids blasting on first launch
volume-max=150
audio-pitch-correction=yes
alang=eng,en,jpn,jp             # preferred audio language order (edit to taste)

###############################################################################
# SUBTITLES
###############################################################################

slang=eng,en
sub-auto=fuzzy                 # load subs even if filename doesn't match exactly
sub-font='JetBrainsMono Nerd Font'
sub-font-size=38
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'
sub-border-size=2.4
sub-shadow-offset=0

###############################################################################
# WINDOW / UI
###############################################################################

border=no                      # no window decorations
osc=yes                        # on-screen controller for mouse users
osd-font='JetBrainsMono Nerd Font'
osd-font-size=32
osd-bar-align-y=0.9
title=${media-title}
autofit-larger=90%x90%         # never open a window bigger than 90% of the screen
keep-open=yes                  # don't close mpv when a file finishes; easier for playlists/review

###############################################################################
# PLAYBACK BEHAVIOR
###############################################################################

save-position-on-quit=yes      # resume where you left off
resume-playback=yes
watch-later-directory=~/.local/state/mpv/watch_later

screenshot-directory=~/Pictures/mpv-screenshots
screenshot-format=png
screenshot-template='%F-%P'

###############################################################################
# CACHE / NETWORK (important for streaming via yt-dlp)
###############################################################################

cache=yes
cache-secs=300
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB
network-timeout=10

###############################################################################
# YT-DLP INTEGRATION
###############################################################################

script-opts=ytdl_hook-ytdl_path=yt-dlp
ytdl-format=bestvideo[height<=?1080]+bestaudio/best[height<=?1080]

# no-config= makes mpv's yt-dlp calls ignore ~/.config/yt-dlp/config, so
# download-only options (archive, embedding, output paths) don't affect
# playback. The earlier "'false' is not a valid URL" error was caused by a
# bad line in that config (--write-auto-subs false), now fixed there.
ytdl-raw-options=sponsorblock-mark=all,no-config=

###############################################################################
# MISC
###############################################################################

load-scripts=yes
osd-duration=1500
msg-level=all=warn             # keep the terminal quiet unless something's wrong

# Per-file overrides go in mpv.conf profiles below, or a sibling file
# like ~/.config/mpv/profiles.conf if you want to split them out.
